# Same layout as your old hyperlock.conf — blurred desktop, big clock, quiet input.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.25, 0.9, 0.3, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = screenshot
    color = rgb(0e1416)
    blur_passes = 4
    blur_size = 6
    brightness = 0.6
    contrast = 1
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(dbe5e7c0)
    font_size = 20
    font_family = Ubuntu Sans
    position = 0, 405
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%k:%M"
    color = rgba(dbe5e7d0)
    font_size = 150
    font_family = Ubuntu Sans Heavy
    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = || Hello There ||
    color = rgba(dbe5e7c0)
    font_size = 20
    font_family = Ubuntu Sans Bold
    position = 0, -400
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(5ec4b660)
    inner_color = rgba(0e141680)
    font_color = rgba(dbe5e7ff)
    check_color = rgba(7fb4e0ff)
    fail_color = rgba(e5737aff)
    capslock_color = rgba(e8c27aff)
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##dbe5e780">Enter password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    font_family = Ubuntu Sans
    position = 0, -460
    halign = center
    valign = center
}
