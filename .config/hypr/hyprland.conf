# Hyprland — ASUS Vivobook S15 (Meteor Lake, 2880x1620@120)
# Wiki: https://wiki.hypr.land/Configuring/

source = ~/.config/hypr/colors.conf


################
### MONITORS ###
################

# Laptop panel: scripts/monitors.sh turns it off when the home LG is connected
monitor = eDP-1, 2880x1620@120, 0x0, 1.5
# Desk monitor: run at its 100Hz mode instead of the 60Hz "preferred" one
monitor = desc:ASUSTek COMPUTER INC VZ27EHF S5LMTJ021569, 1920x1080@100.09, auto-up, 1
# Any external screen: best mode, placed above the laptop (your usual desk setup)
monitor = , preferred, auto-up, 1


################
### PROGRAMS ###
################

$terminal    = kitty --single-instance   # reuse running kitty: new windows open instantly instead of ~0.6s cold start
$fileManager = nautilus
$browser     = google-chrome
$menu        = rofi -show drun
$scripts     = ~/.config/hypr/scripts


#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd --all
exec-once = $scripts/monitors.sh --watch
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Was in ~/.config/autostart (Hyprland doesn't read XDG autostart)
exec-once = /usr/bin/shenavar --autostart
exec-once = ~/Apps/jetbrains-toolbox-3.4.3.81140/bin/jetbrains-toolbox --minimize


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
# Java/Swing apps (Burp, IDA, JetBrains) render blank in tiling WMs without this
env = _JAVA_AWT_WM_NONREPARENTING,1

env = SSH_AUTH_SOCK,/run/user/1001/gcr/ssh


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2

    col.active_border = $accent $accent2 45deg
    col.inactive_border = rgba(24333aaa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.5

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.17
        popups = true
    }
}

animations {
    enabled = true

    #        NAME,         X0,   Y0,   X1,   Y1
    bezier = easeOutQuint, 0.23, 1,    0.32, 1
    bezier = easeInOut,    0.65, 0.05, 0.36, 1
    bezier = soft,         0.25, 0.9,  0.3,  1
    bezier = linear,       0,    0,    1,    1

    #           NAME,             ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,           1,     8,     default
    animation = border,           1,     5,     easeOutQuint
    animation = borderangle,      0
    animation = windowsIn,        1,     4,     easeOutQuint, popin 92%
    animation = windowsOut,       1,     2.5,   soft,         popin 92%
    animation = windowsMove,      1,     4,     easeOutQuint
    animation = fadeIn,           1,     2.5,   soft
    animation = fadeOut,          1,     2,     soft
    animation = fadeSwitch,       1,     3,     soft
    animation = fadeDim,          1,     3,     soft
    animation = layersIn,         1,     3,     easeOutQuint, fade
    animation = layersOut,        1,     2,     soft,         fade
    animation = workspaces,       1,     4.5,   easeOutQuint, slide
    animation = specialWorkspace, 1,     4,     easeOutQuint, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $bg
    vfr = true                       # don't render when nothing changes (battery)
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    animate_manual_resizes = false
    middle_click_paste = false
}

cursor {
    hide_on_key_press = true
    inactive_timeout = 8
}

xwayland {
    force_zero_scaling = true        # keeps VS Code / JetBrains crisp
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ir
    kb_options = grp:win_space_toggle   # SUPER+Space switches EN/FA

    repeat_rate = 40
    repeat_delay = 300

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.6
    }
}

gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 400
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_create_new = false
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, V, exec, $scripts/clipboard.sh
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Session
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, M, exec, wlogout -b 5 -c 12 -r 12 -p layer-shell
bind = $mainMod SHIFT, M, exit,
bind = $mainMod SHIFT, W, exec, pkill waybar; waybar

# Notifications
bind = $mainMod, N, exec, dunstctl history-pop
bind = $mainMod SHIFT, N, exec, dunstctl close-all

# Windows
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1   # maximize, keep bar + gaps
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, C, centerwindow,

# Screenshots (saved to ~/Pictures/Screenshots, same naming as GNOME)
bind = , Print, exec, $scripts/screenshot.sh region-edit
bind = CTRL, Print, exec, $scripts/screenshot.sh region
bind = SHIFT, Print, exec, $scripts/screenshot.sh screen

# Focus / move / resize
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, TAB, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Media / hardware keys (with on-screen indicator)
bindel = , XF86AudioRaiseVolume, exec, $scripts/osd.sh volume-up
bindel = , XF86AudioLowerVolume, exec, $scripts/osd.sh volume-down
bindl  = , XF86AudioMute, exec, $scripts/osd.sh volume-mute
bindl  = , XF86AudioMicMute, exec, $scripts/osd.sh mic-mute
bindel = , XF86MonBrightnessUp, exec, $scripts/osd.sh brightness-up
bindel = , XF86MonBrightnessDown, exec, $scripts/osd.sh brightness-down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Clamshell: closing the lid with an external monitor turns the laptop panel off
bindl = , switch:on:Lid Switch, exec, $scripts/monitors.sh
bindl = , switch:off:Lid Switch, exec, $scripts/monitors.sh


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-utilities
    match:class = ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|xdg-desktop-portal-gtk|hyprland-share-picker|nwg-look)$
    float = on
    size = 900 600
    center = on
}

windowrule {
    name = float-dialogs
    match:title = ^(Open File|Open Folder|Save As|Save File|File Upload|Select a File|Choose Files).*$
    float = on
    center = on
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = on
    pin = on
    keep_aspect_ratio = on
    size = 480 270
    move = (monitor_w-500) (monitor_h-290)
}

windowrule {
    # JetBrains popups/tooltips steal focus otherwise
    name = jetbrains-popups
    match:class = ^(jetbrains-.*)$
    match:title = ^(win[0-9]+)$
    no_initial_focus = true
}

layerrule {
    name = blur-bar
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.2
}

layerrule {
    name = blur-launcher
    match:namespace = rofi
    blur = on
    ignore_alpha = 0.2
    animation = popin 95%
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = on
    ignore_alpha = 0.2
    animation = slide right
}

layerrule {
    name = blur-logout
    match:namespace = logout_dialog
    blur = on
}
