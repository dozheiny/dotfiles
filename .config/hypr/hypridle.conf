general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false          # videos / calls keep the screen on
}

# 2.5 min — dim
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min — lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# 15 min — suspend, but only on battery (keeps SSH tunnels / long jobs alive on AC)
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/ADP0/online)" = 0 ] && systemctl suspend
}
