font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

disable_ligatures always

enable_audio_bell no

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
map ctrl+click launch --type=tab xdg-open {url}

window_padding_width 10
confirm_os_window_close 0
background_opacity 0.94
hide_window_decorations yes
scrollback_lines 10000

tab_bar_style powerline
tab_powerline_style slanted

# Palette — matches Hyprland / Waybar
foreground            #dbe5e7
background            #0e1416
selection_foreground  #0e1416
selection_background  #5ec4b6
cursor                #5ec4b6
cursor_text_color     #0e1416
url_color             #7fb4e0
active_border_color   #5ec4b6
inactive_border_color #24333a
active_tab_foreground   #0e1416
active_tab_background   #5ec4b6
inactive_tab_foreground #6b7f86
inactive_tab_background #182226
tab_bar_background      #0e1416

color0  #182226
color8  #4a5c63
