; Polybar — same modules, glyphs and palette as ~/.config/waybar.
; A single floating island; picom rounds it (24px) and blurs what's behind.
; Docs: https://github.com/polybar/polybar/wiki

[colors]
bg      = #8c0e1416
surface = #182226
overlay = #24333a
muted   = #6b7f86
fg      = #dbe5e7
accent  = #5ec4b6
accent2 = #7fb4e0
red     = #e5737a
yellow  = #e8c27a


[bar/main]
monitor = ${env:MONITOR:}
dpi = 144

; floating: 15px from the edges (waybar margin 10 × 1.5); i3 keeps windows clear via "gaps top"
width = 100%:-30
height = 48
offset-x = 15
offset-y = 9
override-redirect = true
wm-restack = i3

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 15px
padding-right = 21px
module-margin = 12px
fixed-center = true

font-0 = "JetBrainsMono Nerd Font:size=10:weight=medium;3"
font-1 = "JetBrainsMono Nerd Font:size=10:weight=bold;3"
font-2 = "Vazirmatn:size=10;3"

modules-left = i3 mpris
modules-center = date
modules-right = tray xkeyboard cpu memory wlan eth bluetooth pulseaudio battery power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; Other monitors: same bar without the tray
[bar/secondary]
inherit = bar/main
modules-right = xkeyboard cpu memory wlan eth bluetooth pulseaudio battery power


[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
show-urgent = true

format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = ${colors.yellow}

label-focused = 
label-focused-foreground = ${colors.accent}
label-focused-padding = 9px
label-visible = 
label-visible-foreground = ${colors.muted}
label-visible-padding = 9px
label-unfocused = 
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 9px
label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-padding = 9px


[module/mpris]
type = custom/script
exec = ~/.config/polybar/scripts/mpris.sh
tail = true
click-left = playerctl play-pause


[module/date]
type = internal/date
interval = 1
date = %a %d,
time = %I:%M %p
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
label = %date% %time%
label-font = 2


[module/tray]
type = internal/tray
tray-size = 24
tray-spacing = 15px


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
blacklist-2 = caps lock
layout-icon-0 = us;EN
layout-icon-1 = ir;FA
label-layout =   %icon%


[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 70
format = %{A1:kitty -e htop &:}<label>%{A}
format-warn = %{A1:kitty -e htop &:}<label-warn>%{A}
label =   %percentage%%
label-warn =   %percentage%%
label-warn-foreground = ${colors.red}


[module/memory]
type = internal/memory
interval = 2
warn-percentage = 80
label =   %percentage_used%%
label-warn =   %percentage_used%%
label-warn-foreground = ${colors.red}


[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:nm-connection-editor &:}<label-connected>%{A}
label-connected =   %essid%
label-connected-maxlen = 22
format-disconnected = %{A1:nm-connection-editor &:}<label-disconnected>%{A}
label-disconnected =   offline
label-disconnected-foreground = ${colors.muted}


[module/eth]
type = internal/network
interface-type = wired
interval = 3
label-connected =   up
format-disconnected =


[module/bluetooth]
type = custom/script
; a polling loop instead of `interval`: polybar 3.7 sometimes drops interval-script output in a full bar
exec = while :; do ~/.config/polybar/scripts/bluetooth.sh; sleep 5; done
tail = true
click-left = blueman-manager &
click-right = rfkill toggle bluetooth


[module/pulseaudio]
type = internal/pulseaudio
interval = 5
use-ui-max = true
format-volume = %{A1:pavucontrol &:}<ramp-volume>  <label-volume>%{A}
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
format-muted = %{A1:pavucontrol &:}<label-muted>%{A}
label-muted =   muted
label-muted-foreground = ${colors.muted}
click-right = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 100
low-at = 10
poll-interval = 10

format-charging = <label-charging>
label-charging =   %percentage%%
label-charging-foreground = ${colors.accent}

format-discharging = <ramp-capacity>  <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.yellow}
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

format-full = <label-full>
label-full =   %percentage%%

format-low = <label-low>
label-low =   %percentage%%
label-low-foreground = ${colors.red}


[module/power]
type = custom/text
format = 
format-padding = 3px
click-left = ~/.config/i3/scripts/powermenu.sh &


[settings]
screenchange-reload = true
pseudo-transparency = false
