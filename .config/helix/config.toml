theme = "gruvbox"

[editor]
line-number = "relative"
mouse = true
bufferline = "multiple"
cursorline = true
color-modes = true
true-color = true
rulers = [120]
popup-border = "all"
completion-trigger-len = 1
completion-timeout = 5
completion-replace = true          # accepting a completion replaces the whole word under the cursor
idle-timeout = 50
auto-save = { focus-lost = true }
trim-trailing-whitespace = true
trim-final-newlines = true
end-of-line-diagnostics = "hint"
gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.smart-tab]
enable = true
supersede-menu = true

[editor.lsp]
display-messages = true
display-inlay-hints = true
display-progress-messages = true
goto-reference-include-declaration = false

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.indent-guides]
render = true
character = "▏"
skip-levels = 1

[editor.whitespace.render]
tab = "all"
nbsp = "all"
nnbsp = "all"

[editor.whitespace.characters]
tab = "→"
tabpad = " "
nbsp = "⍽"
nnbsp = "␣"

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-type", "version-control"]
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"
