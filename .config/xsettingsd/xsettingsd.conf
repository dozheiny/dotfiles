# GTK settings for X11 sessions (i3) — what gnome-settings-daemon would provide
Net/ThemeName        "Yaru-prussiangreen-dark"
Net/IconThemeName    "Yaru-prussiangreen-dark"
Gtk/CursorThemeName  "Yaru"
Gtk/CursorThemeSize  36
Gtk/FontName         "Ubuntu Sans 11"
Net/EnableEventSounds 0
Net/EnableInputFeedbackSounds 0

# 144 dpi (× 1024) — 1.5x text, like scale 1.5 on Hyprland
Xft/DPI       147456
Xft/Antialias 1
Xft/Hinting   1
Xft/HintStyle "hintslight"
Xft/RGBA      "rgb"
