# picom v12 — the "Hyprland feel" for i3: rounded corners, blur, soft shadows, animations.
# Sizes are physical pixels (Hyprland values × 1.5).
# Docs: man picom  ·  https://picom.app

# If focus border colors ever lag behind (seen only under Xephyr), use backend = "xrender".
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;


### Corners
corner-radius = 18;


### Shadows (Hyprland: range 18, rgba(00000066))
shadow = true;
shadow-radius = 26;
shadow-opacity = 0.40;
shadow-offset-x = -24;
shadow-offset-y = -20;
shadow-color = "#000000";


### Blur — behind translucent windows only (kitty, bar, rofi, dunst)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-frame = false;


### Fading (fallback for anything without an animation below)
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.09;
fade-delta = 6;


### Animations — same curves as hyprland.conf
# easeOutQuint = cubic-bezier(0.23, 1, 0.32, 1)   soft = cubic-bezier(0.25, 0.9, 0.3, 1)
animations = (
    # windowsIn: popin 92%
    {
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.92;
        duration = 0.22;
    },
    # windowsOut: popin 92%
    {
        triggers = [ "close" ];
        preset = "disappear";
        scale = 0.92;
        duration = 0.15;
    },
    # workspace switch / scratchpad: quick crossfade
    {
        triggers = [ "show" ];
        opacity = {
            curve = "cubic-bezier(0.25, 0.9, 0.3, 1)";
            duration = 0.16;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
    },
    {
        triggers = [ "hide" ];
        opacity = {
            curve = "cubic-bezier(0.25, 0.9, 0.3, 1)";
            duration = 0.12;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
    },
    # windowsMove: tiles glide into their new place
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.22;
    }
);


### Per-window rules
rules = (
    # Menus, tooltips, dropdowns: no picom shadow (apps draw their own), small corners, no blur
    {
        match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'combo' || window_type = 'dnd'";
        shadow = false;
        blur-background = false;
        corner-radius = 0;
        animations = (
            { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.98; duration = 0.10; },
            { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.98; duration = 0.08; }
        );
    },

    # Bar: floating rounded island with frosted glass, never animated
    {
        match = "class_g = 'Polybar' || window_type = 'dock'";
        corner-radius = 24;
        shadow = false;
        animations = ( );
    },

    # Launcher: matches rofi's own 24px radius, pops in like Hyprland's "popin 95%"
    {
        match = "class_g = 'Rofi'";
        corner-radius = 24;
        animations = (
            { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.95; duration = 0.16; },
            { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.10; }
        );
    },

    # Notifications
    {
        match = "class_g = 'Dunst'";
        corner-radius = 21;
        animations = (
            { triggers = [ "open", "show" ]; preset = "fly-in"; direction = "right"; duration = 0.22; },
            { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.12; }
        );
    },

    # Fullscreen: square, no shadow, no animation
    {
        match = "fullscreen";
        corner-radius = 0;
        shadow = false;
        animations = ( );
    },

    # Lock screen: appears instantly
    {
        match = "class_g = 'i3lock'";
        corner-radius = 0;
        shadow = false;
        fade = false;
        animations = ( );
    },

    # Screenshot selection overlay / flameshot must stay sharp and instant
    {
        match = "class_g = 'flameshot' || class_g = 'slop' || name = 'maim'";
        corner-radius = 0;
        shadow = false;
        blur-background = false;
        animations = ( );
    }
);
